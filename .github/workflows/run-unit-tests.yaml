name: Run unit tests
on: [push]
jobs:
  run-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - run: npm run test
        env:
          DATABASE_URL: "postgresql://docker:docker@localhost:5432/gymapp?schema=public"
